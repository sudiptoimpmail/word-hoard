<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1320" media="(prefers-color-scheme: dark)">
<style>*,*::before,*::after{box-sizing:border-box}html{height:100%;padding-top:env(safe-area-inset-top,0px)}body{margin:0;font-size:15px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Word Hoard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Word Hoard">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Charis+SIL:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone app — slim top bar, a single working surface, iOS-style tab bar pinned to the bottom.
   Ink taken from the notebook itself: navy headwords, red UK / blue US IPA, index-card paper. */
:root{
  --paper:#eef1f5; --card:#ffffff; --ink:#141a2e; --muted:#5d6579; --line:#d8dde7;
  --navy:#1f2f8a; --uk:#c2362b; --us:#2d5fd0; --good:#1f8a5b; --bad:#c2362b; --chip:#e3e8f2;
  --shadow:0 1px 2px rgba(20,26,46,.06),0 8px 24px rgba(20,26,46,.08);
  --f-head:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Charis SIL",Georgia,serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1320; --card:#1a2033; --ink:#e8ebf3; --muted:#9aa3b8; --line:#2c3450;
  --navy:#9fb0ff; --uk:#ff8a7e; --us:#86aaff; --good:#5fd39b; --bad:#ff8a7e; --chip:#252c44;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1320; --card:#1a2033; --ink:#e8ebf3; --muted:#9aa3b8; --line:#2c3450;
  --navy:#9fb0ff; --uk:#ff8a7e; --us:#86aaff; --good:#5fd39b; --bad:#ff8a7e; --chip:#252c44;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding-block:10px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-head);font-size:22px;color:var(--navy);flex:1;letter-spacing:.2px}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;height:36px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.view{flex:1;min-height:0;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view[hidden]{display:none!important}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--card);padding-bottom:max(6px,env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{background:none;border:0;padding:8px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--navy)}
.tabs svg{width:24px;height:24px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--card)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding-bottom:8px;font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--navy);transition:width .3s}

/* flashcard */
.stage{flex:1;min-height:0;position:relative;perspective:1400px}
.fc{position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
.fc .inner{position:absolute;inset:0;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.fc.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.face .scroll{flex:1;overflow-y:auto;padding:22px 20px;-webkit-overflow-scrolling:touch}
.front .scroll{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.cardno{position:absolute;top:12px;left:16px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.hw{font-family:var(--f-head);color:var(--navy);font-size:clamp(32px,10vw,46px);line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
.hw.sm{font-size:28px}
.ipa{font-family:var(--f-body);color:var(--uk);font-size:18px}
.pos{font-family:var(--f-body);font-style:italic;color:var(--muted);font-size:16px}
.hint{font-size:12px;color:var(--muted);margin-top:14px}
.frontdef{font-family:var(--f-body);font-size:21px;line-height:1.45;text-wrap:balance}
.frontimg{max-height:46vh;border-radius:10px;object-fit:contain}
.sense{font-family:var(--f-body);font-size:18px;line-height:1.45;margin:10px 0 0;display:flex;gap:8px}
.sense b{color:var(--navy);font-family:var(--f-ui);font-size:13px;padding-top:4px}
.exs{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.exs li{font-family:var(--f-body);font-style:italic;color:var(--ink);opacity:.85;font-size:16px;line-height:1.45;padding-left:12px;border-left:2px solid var(--line)}
.explain mark,.exs li mark{background:none;color:var(--navy);font-weight:700;font-style:italic}
.pics{display:flex;gap:10px;overflow-x:auto;margin-top:16px;padding-bottom:4px}
.pics figure{margin:0;flex:none;position:relative}
.pics img{height:170px;width:auto;max-width:78vw;border-radius:10px;object-fit:cover;background:var(--chip);display:block}
.pics .solo img{height:auto;max-height:230px;max-width:100%}
.pics .x{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:999px;font-size:11px;padding:3px 8px}
.backhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.say{border:0;background:var(--chip);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;color:var(--navy);flex:none}
.say svg{width:18px;height:18px}
.stamp{position:absolute;top:24px;padding:6px 12px;border:3px solid;border-radius:8px;font-weight:800;font-size:18px;letter-spacing:.06em;opacity:0;pointer-events:none;z-index:3;text-transform:uppercase;background:var(--card)}
.stamp.know{left:20px;color:var(--good);transform:rotate(-12deg)}
.stamp.learn{right:20px;color:var(--bad);transform:rotate(12deg)}
.actions{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;padding:14px 0 12px;align-items:center}
.big{border:0;border-radius:14px;padding:14px 10px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.big.learn{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)}
.big.know{background:color-mix(in srgb,var(--good) 16%,var(--card));color:var(--good)}
.round{border:1px solid var(--line);background:var(--card);border-radius:999px;width:48px;height:48px;display:grid;place-items:center}
.round svg{width:20px;height:20px}
.done{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;padding:20px}
.done h2{font-family:var(--f-head);color:var(--navy);font-weight:400;font-size:30px;margin:0}
.done p{color:var(--muted);margin:0;max-width:32ch;line-height:1.5}
.primary{background:var(--navy);color:var(--card);border:0;border-radius:14px;padding:14px 22px;font-weight:700;font-size:15px}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 22px;font-weight:700;font-size:15px}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(10,14,28,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet .panel{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:85%;overflow:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet h3{font-family:var(--f-head);font-weight:400;color:var(--navy);font-size:22px;margin:0 0 6px}
.sheet .grp{margin-top:16px}
.sheet .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.danger{color:var(--bad);background:none;border:0;font-weight:700;padding:8px 0;margin-top:14px}

/* quiz */
.qsetup{flex:1;overflow:auto;padding-bottom:16px;display:flex;flex-direction:column;gap:18px}
.qsetup h2{font-family:var(--f-head);font-weight:400;color:var(--navy);margin:6px 0 0;font-size:28px}
.qsetup p{margin:0;color:var(--muted);line-height:1.5}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.mode b{font-size:14px}
.mode span{font-size:12px;color:var(--muted);line-height:1.35}
.mode[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.qwrap{flex:1;min-height:0;overflow:auto;padding-bottom:16px;display:flex;flex-direction:column;gap:14px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.qkind{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qsent{font-family:var(--f-body);font-size:20px;line-height:1.5}
.qsent .blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--navy);color:var(--navy);font-weight:700}
.qimg{max-height:34vh;max-width:100%;border-radius:10px;object-fit:contain}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;font-size:16px;line-height:1.35;display:flex;gap:10px;align-items:flex-start}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;background:var(--chip);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.opt.serif{font-family:var(--f-body)}
.opt.word{font-family:var(--f-head);font-size:19px;color:var(--navy)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.opt:disabled{cursor:default}
.explain{background:var(--chip);border-radius:14px;padding:14px;font-family:var(--f-body);font-size:16px;line-height:1.45;display:flex;gap:12px;align-items:flex-start}
.explain img{width:72px;height:72px;object-fit:cover;border-radius:8px;flex:none}
.explain b{font-family:var(--f-head);font-weight:400;color:var(--navy);font-size:18px}
.score{font-family:var(--f-head);font-size:64px;color:var(--navy);line-height:1}
.missed{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px;margin-top:6px}
.missed div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-family:var(--f-body);font-size:15px;line-height:1.4}
.missed b{font-family:var(--f-head);font-weight:400;color:var(--navy)}

/* words */
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;font:inherit;font-size:16px;color:var(--ink);margin:4px 0 10px}
.list{flex:1;overflow-y:auto;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px)) 16px}
.row{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row .t{flex:1;min-width:0}
.row .w{font-family:var(--f-head);color:var(--navy);font-size:18px}
.row .d{font-family:var(--f-body);color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row img{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:var(--chip)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--line)}
.dot.l1,.dot.l2{background:var(--uk)} .dot.l3,.dot.l4{background:#d99a1e} .dot.l5{background:var(--good)}
.detail .panel{padding-top:22px}
.plain{font-family:var(--f-body);font-size:21px;line-height:1.4;margin:12px 0 0;text-wrap:pretty}
.sub{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 0}
.sub+.exs{margin-top:8px}
.dict .sense{font-size:15px;color:var(--muted);margin-top:6px}
.ghost.small{padding:9px 14px;font-size:13px;border-radius:999px;margin-top:8px}
.finder .hint{margin-top:8px}
.cands{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cands figure{margin:0;position:relative;min-width:0}
.cands img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--chip);display:block}
.cands figcaption{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.keep{position:absolute;top:6px;right:6px;border:0;border-radius:999px;background:var(--navy);color:var(--card);font-size:12px;font-weight:700;padding:5px 10px}
.keep:disabled{background:var(--good)}
@media (prefers-reduced-motion: reduce){.fc .inner,.bar i{transition:none}}
</style>
</head><body>
<div class="app">
  <header class="top">
    <div class="brand">Word Hoard</div>
    <button class="iconbtn" id="optsBtn" aria-label="Study options">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      <span id="optsLabel">Options</span>
    </button>
  </header>

  <!-- STUDY -->
  <section class="view" id="v-study">
    <div class="chips" id="deckChips" role="group" aria-label="Deck"></div>
    <div class="meta"><span id="deckName">All words</span><span id="counter">0 / 0</span></div>
    <div class="bar"><i id="prog" style="width:0"></i></div>
    <div class="stage" id="stage"></div>
    <div class="actions" id="actions">
      <button class="big learn" id="btnLearn">← Still learning</button>
      <button class="round" id="btnUndo" aria-label="Previous card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button class="big know" id="btnKnow">Know it →</button>
    </div>
  </section>

  <!-- QUIZ -->
  <section class="view" id="v-quiz" hidden></section>

  <!-- WORDS -->
  <section class="view" id="v-words" hidden>
    <input class="search" id="q" type="search" placeholder="Search 825 words or meanings" autocomplete="off" autocapitalize="off">
    <div class="meta"><span id="wcount"></span><span id="wstats"></span></div>
    <div class="list" id="list"></div>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="study"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="6" y="3" width="13" height="17" rx="2.5"/><path d="M4 7v11.5A2.5 2.5 0 0 0 6.5 21H15"/></svg>Cards</button>
    <button role="tab" aria-selected="false" data-tab="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>Quiz</button>
    <button role="tab" aria-selected="false" data-tab="words"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Words</button>
  </nav>
</div>

es of 5% are envisaged for the next year.","[ + that ] It 's envisaged that the building will start at the end of this year.","[ + -ing verb ] When do you envisage finish ing the project?","[ + question word ] It 's hard to envisage how it might happen."],"i":[],"c":1,"m":"to imagine something as possible in the future","n":["I envisage opening my own business one day.","Nobody envisaged the project taking five years."]},{"w":"herald","p":"","s":"verb","d":["to be a sign that something important, and often good, is starting to happen, or to make something publicly known, especially by celebrating or praising it","formal a sign that something will happen, change, etc"],"x":["The president's speech heralds a new era in foreign policy.","This drug has been heralded as a major breakthrough in the fight against breast cancer.","If this first opera of the season is a herald (= sign) of what is to come, we can expect great things."],"i":[],"c":1,"m":"to be a sign that something important is coming","n":["The first robins herald the arrival of spring.","The new law heralds a big change in policy."]},{"w":"portend","p":"/pɔːˈtend/","s":"verb","d":["to be a sign that something bad is likely to happen in the future"],"x":["It was a deeply superstitious country, where earthquakes were commonly believed to portend the end of dynasties."],"i":[],"c":1,"m":"to be a sign that something bad will happen","n":["The falling sales may portend layoffs.","Thunder in the distance portended a storm."]},{"w":"hunch","p":"/hʌntʃ/","s":"noun","d":["an idea which is based on feeling and for which there is no proof"],"x":["[ + that ] I had a hunch that you'd be here.","Sometimes you have to be prepared to act on/follow a hunch."],"i":[],"c":1,"m":"a feeling that something is true, without proof","n":["I have a hunch she'll say yes.","Acting on a hunch, the detective checked the garage."]},{"w":"inkling","p":"","s":"noun","d":["when you think that something is true or likely to happen, although you are not certain"],"x":["[ + that ] I didn't have the slightest inkling that she was unhappy.","He must have had some inkling of what was happening."],"i":[],"c":1,"m":"a slight idea or suspicion","n":["I had no inkling they were planning a party.","Did you have any inkling of the trouble ahead?"]},{"w":"silhouette","p":"/ˌsɪl.uˈet/","s":"noun","d":["a dark shape seen against a light surface"],"x":["The silhouette of the bare tree on the hill was clear against the winter sky."],"i":["img/3626b26422.jpg"],"c":1,"m":"a dark outline seen against a bright background","n":["We saw the silhouette of a man in the doorway.","The skyline made a beautiful silhouette at sunset."]},{"w":"pant","p":"/pænt/","s":"verb","d":["to breathe quickly and loudly through your mouth, usually because you have been doing something very energetic"],"x":["Matteo arrived at the top of the hill, panting and covered in sweat."],"i":["img/ffcb0635c5.jpg"],"c":1,"m":"to breathe fast and loudly, usually after effort","n":["The dog was panting after the long run.","She arrived panting at the top of the stairs."]},{"w":"occult","p":"/ˈɒk.ʌlt/","s":"adjective","d":["relating to magical powers and activities, such as those of witchcraft and astrology"],"x":["She claims to have occult powers, given to her by some mysterious spirit."],"i":["img/029597992d.jpg"],"c":1,"m":"related to magic and supernatural powers","n":["He collects books about the occult.","The film is about an occult ritual gone wrong."]},{"w":"slump","p":"/slʌmp/","s":"verb","d":["(of prices, values or sales) to fall suddenly","to sit or fall heavily and suddenly"],"x":["The value of property has slumped.","Car sales have slumped dramatically over the past year.","She slumped into the chair, exhausted."],"i":[],"c":1,"m":"to fall suddenly (prices, sales); to sit or fall heavily","n":["Car sales slumped in the winter.","He slumped into the chair, exhausted."]},{"w":"Purgatory","p":"/ˈpɜː.gə.tri/","s":"noun","d":["the place to which Roma /* ---------- usage blanks ---------- */
function blankRe(word){
  const w=word.toLowerCase().replace(/[^a-z' -]/g,"").trim();
  if(!w) return null;
  if(w.includes(" ")) return new RegExp("\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/ /g,"\\s+")+"\\b","i");
  const stems=new Set([w]);
  if(w.length>4&&/e$/.test(w)) stems.add(w.slice(0,-1));
  if(w.length>4&&/y$/.test(w)) stems.add(w.slice(0,-1)+"i");
  if(w.length>5) stems.add(w.slice(0,-1));
  const alt=[...stems].filter(s=>s.length>=3).sort((a,b)=>b.length-a.length).join("|");
  return new RegExp("\\b("+alt+")[a-z]*\\b","i");
}
W.forEach(w=>{

});

function buildQueue(){
  const d=deckById(S.deck);

  else if(S.order==="weak") list=shuffle(list).sort((a,b)=>(lvl(a)||2.5)-(lvl(b)||2.5));

}
function renderChips(){

function frontHTML(w){

function backHTML(w){

/* ---------- online picture search (runs on the phone) ---------- */
const picCache={};
async function searchPics(word){
  if(picCache[word]) return picCache[word];
  const q=encodeURIComponent(word.replace(/\bsth\b|\bsb\b/g,"").trim());
  const out=[];
  const tasks=[
    fetch(`https://api.openverse.org/v1/images/?q=${q}&page_size=8&mature=false`).then(r=>r.json()).then(j=>(j.results||[]).forEach(r=>out.push({u:r.thumbnail||r.url,c:`${r.creator||"Unknown"} · ${String(r.license||"").toUpperCase()} ${r.license_version||""} · Openverse`,l:r.foreign_landing_url}))).catch(()=>{}),
    fetch(`https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${q}&gsrlimit=6&prop=pageimages&piprop=thumbnail&pithumbsize=480&format=json&origin=*`).then(r=>r.json()).then(j=>Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>a.index-b.index).forEach(p=>{if(p.thumbnail)out.push({u:p.thumbnail.source,c:`Wikipedia · ${p.title}`,l:`https://en.wikipedia.org/wiki/${encodeURIComponent(p.title)}`});})).catch(()=>{})
  ];
  await Promise.all(tasks);
  const seen=new Set(); const res=out.filter(o=>o.u&&!seen.has(o.u)&&seen.add(o.u)).slice(0,10);
  if(res.length) picCache[word]=res;
  return res;
}
async function runFinder(box,w){
  box.innerHTML=`<div class="hint">Looking for pictures of “${esc(w.w)}”…</div>`;
  const res=await searchPics(w.w);
  if(!res.length){ box.innerHTML=`<div class="hint">No pictures found. Picture search needs an internet connection, and it doesn't work in the claude.ai preview.</div><button class="ghost small" data-find>Try again</button>`; return; }
  const kept=new Set(imgs(w));
  box.innerHTML=`<div class="hint" style="margin:0 0 8px">Tap ＋ Keep on any picture that helps you remember the word.</div><div class="cands">${res.map((r,k)=>`<figure><img src="${esc(r.u)}" alt="" loading="lazy" referrerpolicy="no-referrer"><button class="keep" data-keep="${k}" ${kept.has(r.u)?"disabled":""}>${kept.has(r.u)?"Kept":"＋ Keep"}</button><figcaption>${esc(r.c)}</figcaption></figure>`).join("")}</div>`;
  box.querySelectorAll("[data-keep]").forEach(b=>b.onclick=e=>{e.stopPropagation();const r=res[+b.dataset.keep];(S.add[w.w]=S.add[w.w]||[]).push({u:r.u,c:r.c});save();b.textContent="Kept";b.disabled=true;});
}
function bindBack(root,w){
  root.addEventListener("click",e=>{
    const f=e.target.closest("[data-find]");
    if(f){ e.stopPropagation(); runFinder(f.closest(".finder"),w); return; }
    const h=e.target.closest("[data-hide]");
    if(h){ e.stopPropagation(); const src=h.dataset.hide;
      if(src.startsWith("http")) S.add[w.w]=(S.add[w.w]||[]).filter(a=>a.u!==src); else (S.hide[w.w]=S.hide[w.w]||[]).push(src);
      save(); h.parentElement.remove(); return; }
    if(e.target.closest("[data-say]")){ e.stopPropagation(); say(w.w); }
  });
}

function renderCard(){
  const stage=$("#stage"); stage.innerHTML="";
  const tot=queue.length;
  $("#counter").textContent=`${Math.min(pos+1,tot)} / ${tot}`;
  $("#prog").style.width=(tot?pos/tot*100:0)+"%";
  $("#actions").hidden=pos>=tot;
  if(!tot){ stage.innerHTML=`<div class="done"><h2>Nothing here yet</h2><p>This deck is empty. ${S.deck==="learning"?"Swipe a card left in another deck and it will show up here.":"Pick another deck above."}</p></div>`; $("#actions").hidden=true; return; }
  if(pos>=tot){
    stage.innerHTML=`<div class="done"><h2>Deck finished</h2><p>You knew <b>${sessKnow}</b> and marked <b>${sessLearn}</b> as still learning.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">${sessLearn?`<button class="primary" id="goLearn">Review the ${sessLearn} I missed</button>`:""}<button class="ghost" id="again">Shuffle and restart</button></div>
      <button class="ghost" id="toQuiz">Quiz me on this deck</button></div>`;
    const gl=$("#goLearn"); if(gl) gl.onclick=()=>{S.deck="learning";save();buildQueue();};
    $("#again").onclick=buildQueue;
    $("#toQuiz").onclick=()=>{S.qdeck=S.deck;save();show("quiz");};
    return;
  }
  const w=queue[pos];
  const el=document.createElement("div"); el.className="fc";
  el.innerHTML=`<div class="stamp know">Know it</div><div class="stamp learn">Learning</div><div class="inner">${frontHTML(w)}${backHTML(w)}</div>`;
  stage.appendChild(el);
  attachSwipe(el,w);
}
function attachSwipe(el,w){
  let sx=0,sy=0,dx=0,dy=0,drag=false,moved=false,id=null;
  const sk=el.querySelector(".stamp.know"), sl=el.querySelector(".stamp.learn");
  el.addEventListener("pointerdown",e=>{
    if(e.target.closest("button,.cands,.pics")) return;
    id=e.pointerId; sx=e.clientX; sy=e.clientY; dx=dy=0; drag=true; moved=false; el.style.transition="none";
  });
  el.addEventListener("pointermove",e=>{
    if(!drag||e.pointerId!==id) return;
    dx=e.clientX-sx; dy=e.clientY-sy;
    if(!moved && Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)){ moved=true; try{el.setPointerCapture(id);}catch(_){} }
    if(!moved) return;
    el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
    sk.style.opacity=Math.max(0,Math.min(1,dx/90)); sl.style.opacity=Math.max(0,Math.min(1,-dx/90));
  });
  const end=e=>{
    if(!drag) return; drag=false;
    if(moved && Math.abs(dx)>90){ fling(el,dx>0?1:-1,w); return; }
    el.style.transition="transform .25s"; el.style.transform=""; sk.style.opacity=sl.style.opacity=0;
    if(!moved && Math.abs(dy)<8 && !e.target.closest("button,a,.cands")){ el.classList.toggle("flipped");
      if(el.classList.contains("flipped") && !imgs(w).length && navigator.onLine!==false){ const b=el.querySelector(".finder"); if(b&&!b.dataset.ran){ b.dataset.ran=1; runFinder(b,w);} } }
  };
  el.addEventListener("pointerup",end); el.addEventListener("pointercancel",()=>{drag=false;el.style.transform="";});
  bindBack(el,w);
}
function fling(el,dir,w){
  el.style.transition="transform .3s ease-in";
  el.style.transform=`translateX(${dir*window.innerWidth*1.2}px) rotate(${dir*22}deg)`;
  setTimeout(()=>grade(w,dir>0),220);
}
function grade(w,know){
  history.push({w:w.w,prev:S.lv[w.w],know});
  const l=lvl(w);
  S.lv[w.w]= know ? Math.min(5,Math.max(l,1)+ (l===0?2:1)) : 1;
  know?sessKnow++:sessLearn++;
  save(); pos++; renderCard();
}
$("#btnKnow").onclick=()=>{const el=$(".fc"); if(el&&queue[pos]) fling(el,1,queue[pos]);};
$("#btnLearn").onclick=()=>{const el=$(".fc"); if(el&&queue[pos]) fling(el,-1,queue[pos]);};
$("#btnUndo").onclick=()=>{
  const h=history.pop(); if(!h) return;
  if(h.prev===undefined) delete S.lv[h.w]; else S.lv[h.w]=h.prev;
  h.know?sessKnow--:sessLearn--; pos=Math.max(0,pos-1); save(); renderCard();
};
document.addEventListener("keydown",e=>{
  if($("#v-study").hidden||$("#sheetRoot").innerHTML) return;
  if(e.key==="ArrowRight") $("#btnKnow").click();
  else if(e.key==="ArrowLeft") $("#btnLearn").click();

});

/* =================================================================
   QUIZ
   ================================================================= */
const MODES=[
  {id:"mix",t:"Mixed",d:"A bit of everything below"},
  {id:"meaning",t:"Meaning",d:"See a word, pick its meaning"},
  {id:"word",t:"Find the word",d:"See a meaning, pick the word"},
  {id:"usage",t:"Usage",d:"Fill the gap in a real sentence"},
  {id:"picture",t:"Picture",d:"Match the picture to its word"}
];
const Q={active:false,items:[],i:0,score:0,missed:[]};
function renderQuizSetup(){
  Q.active=false;
  const v=$("#v-quiz");
  v.innerHTML=`<div class="qsetup">
    <div><h2>Quiz</h2><p>Questions come from your own notebook: its definitions, its example sentences and its pictures.</p></div>
    <div><div class="meta">Type of question</div><div class="modes">${MODES.map(m=>`<button class="mode" data-m="${m.id}" aria-pressed="${S.qmode===m.id}"><b>${m.t}</b><span>${m.d}</span></button>`).join("")}</div></div>
    <div><div class="meta">Words from</div><div class="chips" style="flex-wrap:wrap">${DECKS.filter(d=>d.id!=="new").map(d=>`<button class="chip" data-qd="${d.id}" aria-pressed="${S.qdeck===d.id}">${esc(d.label)}</button>`).join("")}</div></div>
    <div><div class="meta">Length</div><div class="seg">${[10,20,30].map(n=>`<button class="chip" data-ql="${n}" aria-pressed="${+S.qlen===n}">${n} questions</button>`).join("")}</div></div>
    <button class="primary" id="startQ">Start quiz</button>
    <p id="qerr" style="color:var(--bad)" hidden></p>
  </div>`;
  v.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{S.qmode=b.dataset.m;save();renderQuizSetup();});
  v.querySelectorAll("[data-qd]").forEach(b=>b.onclick=()=>{S.qdeck=b.dataset.qd;save();renderQuizSetup();});
  v.querySelectorAll("[data-ql]").forEach(b=>b.onclick=()=>{S.qlen=+b.dataset.ql;save();renderQuizSetup();});
  $("#startQ").onclick=startQuiz;
}
function canDo(kind,w){
  if(kind==="usage") return w.use.length>0;
  if(kind==="picture") return imgs(w).length>0;
  return w.d.length>0;
}
function distract(w,kind,n){
  let pool=W.filter(o=>o!==w && o.w.toLowerCase()!==w.w.toLowerCase() && o.d.length);
  if(kind==="picture") pool=pool.filter(o=>!imgs(o).some(s=>imgs(w).includes(s)));
  const same=pool.filter(o=>o.s&&o.s===w.s);
  let out=pick(same.length>=n*3?same:pool,n);
  return out;
}
function startQuiz(){
  const deck=deckById(S.qdeck);
  const base=W.filter(deck.f);
  const kinds= S.qmode==="mix"?["meaning","word","usage","picture"]:[S.qmode];
  const items=[]; const used=new Set();
  const cand=shuffle(base);
  for(const w of cand){
    if(items.length>=S.qlen) break;
    const ks=shuffle(kinds).filter(k=>canDo(k,w));
    if(!ks.length||used.has(w.w)) continue;
    used.add(w.w);
    const kind=ks[0];
    const opts=shuffle([w,...distract(w,kind,3)]);
    items.push({w,kind,opts,use:kind==="usage"?w.use[Math.random()*w.use.length|0]:null});
  }
  if(items.length<3){ const e=$("#qerr"); e.hidden=false; e.textContent= base.length?"Not enough words in this deck for that question type. Pick another deck or Mixed.":"This deck is empty. Pick another one."; return; }
  Object.assign(Q,{active:true,items,i:0,score:0,missed:[]});
  renderQ();
}
function renderQ(){
  const v=$("#v-quiz");
  if(Q.i>=Q.items.length) return renderResult();
  const it=Q.items[Q.i], w=it.w, tot=Q.items.length;
  let prompt="", optCls="serif", optText;
  if(it.kind==="meaning"){
    prompt=`<div class="qkind">What does this mean?</div><div class="hw">${esc(w.w)}</div>${w.p?`<div class="ipa">${esc(w.p)}</div>`:""}`;
    optText=o=>mainDef(o);
  } else if(it.kind==="word"){
    prompt=`<div class="qkind">Which word means…</div>${w.s?`<div class="pos">${esc(w.s)}</div>`:""}<div class="frontdef">${esc(mainDef(w))}</div>`;
    optCls="word"; optText=o=>o.w;
  } else if(it.kind==="usage"){
    const u=it.use; const s=u.s;
    prompt=`<div class="qkind">Which word fits the sentence?</div><div class="qsent">${esc(s.slice(0,u.at))}<span class="blank">&nbsp;</span>${esc(s.slice(u.at+u.hit.length))}</div>`;
    optCls="word"; optText=o=>o.w;
  } else {
    prompt=`<div class="qkind">Which word goes with this picture?</div>${imgTag(imgs(w)[0],'class="qimg" alt="Picture clue"')}`;
    optCls="word"; optText=o=>o.w;
  }
  v.innerHTML=`<div class="meta" style="padding-top:4px"><span>Question ${Q.i+1} of ${tot}</span><span>Score ${Q.score}</span></div>
    <div class="bar"><i style="width:${Q.i/tot*100}%"></i></div>
    <div class="qwrap">
      <div class="qcard">${prompt}</div>
      <div class="opts">${it.opts.map((o,k)=>`<button class="opt ${optCls}" data-o="${k}"><span class="k">${"ABCD"[k]}</span><span>${esc(optText(o))}</span></button>`).join("")}</div>
      <div id="fb"></div>
    </div>
    <div style="padding:6px 0 12px;display:flex;gap:10px"><button class="ghost" id="quitQ">End quiz</button></div>`;
  v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.o));
  $("#quitQ").onclick=()=>{ if(Q.i===0) return renderQuizSetup(); Q.items=Q.items.slice(0,Q.i); renderResult(); };
}
function answer(k){
  const it=Q.items[Q.i], w=it.w, ok=it.opts[k]===w;
  document.querySelectorAll(".opt").forEach((b,j)=>{ b.disabled=true; if(it.opts[j]===w) b.classList.add("right"); else if(j===k) b.classList.add("wrong"); });
  if(ok){ Q.score++; S.lv[w.w]=Math.min(5,Math.max(lvl(w),2)+1); }
  else { Q.missed.push(w); S.lv[w.w]=1; }
  save();
  const im=imgs(w)[0];
  const ex=it.kind==="usage"?it.use.s:(w.x[0]||"");
  $("#fb").innerHTML=`<div class="explain">${im&&it.kind!=="picture"?imgTag(im,'alt=""'):""}<div><div style="font-family:var(--f-ui);font-weight:700;color:${ok?"var(--good)":"var(--bad)"};font-size:13px;margin-bottom:2px">${ok?"Correct":"Not quite"}</div><b>${esc(w.w)}</b> — ${esc(mainDef(w))}${ex?`<div style="font-style:italic;margin-top:6px;opacity:.85">${markEx(w,ex)}</div>`:""}</div></div>
    <button class="primary" id="nextQ" style="width:100%;margin-top:12px">${Q.i+1<Q.items.length?"Next question":"See results"}</button>`;
  $("#nextQ").onclick=()=>{Q.i++;renderQ();};
  $("#nextQ").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function renderResult(){
  const v=$("#v-quiz"), tot=Q.items.length, pct=tot?Math.round(Q.score/tot*100):0;
  Q.active=false;
  v.innerHTML=`<div class="qwrap" style="align-items:center;text-align:center;padding-top:20px">
    <div class="qkind">Your score</div><div class="score">${Q.score}<span style="font-size:28px;color:var(--muted)"> / ${tot}</span></div>
    <p style="color:var(--muted);margin:0">${pct>=90?"Excellent. These words are yours.":pct>=70?"Solid. A few to tidy up.":"Worth another round with the cards."}</p>
    ${Q.missed.length?`<div class="missed"><div class="meta" style="padding:8px 0 0">Missed (added to Still learning)</div>${Q.missed.map(w=>`<div><b>${esc(w.w)}</b> — ${esc(mainDef(w))}</div>`).join("")}</div>`:""}
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px">
      ${Q.missed.length?`<button class="primary" id="studyMissed">Study missed words</button>`:""}
      <button class="ghost" id="newQ">New quiz</button></div></div>`;
  const sm=$("#studyMissed"); if(sm) sm.onclick=()=>{S.deck="learning";save();buildQueue();show("study");};
  $("#newQ").onclick=renderQuizSetup;
}

/* =================================================================
   WORDS — browse & search
   ================================================================= */
let listTimer=null;
$("#q").addEventListener("input",()=>{clearTimeout(listTimer);listTimer=setTimeout(renderList,120);});
function renderList(){
  const q=$("#q").value.trim().toLowerCase();
  const res=q?W.filter(w=>w.w.toLowerCase().includes(q)||(w.m||"").toLowerCase().includes(q)||w.d.some(d=>d.toLowerCase().includes(q))).sort((a,b)=>(b.w.toLowerCase().startsWith(q))-(a.w.toLowerCase().startsWith(q))):W;
  const known=Object.values(S.lv).filter(v=>v>=3).length;
  $("#wcount").textContent=`${res.length} words`;
  $("#wstats").textContent=`${known} known`;
  const shown=res.slice(0,400);
  $("#list").innerHTML=shown.map(w=>{const im=imgs(w)[0];return `<button class="row" data-id="${w.id}"><span class="dot l${lvl(w)}" title="progress"></span><span class="t"><div class="w">${esc(w.w)}</div><div class="d">${esc(mainDef(w))}</div></span>${im?imgTag(im,'alt="" loading="lazy"'):""}</button>`;}).join("")+(res.length>400?`<p class="meta" style="padding:12px 0">Showing 400 of ${res.length}. Search to narrow down.</p>`:"");
  $("#list").querySelectorAll(".row").forEach(r=>r.onclick=()=>openWord(W[+r.dataset.id]));
}
function openWord(w){
  const inner=backHTML(w).replace('class="face back"','class="detail-body"');
  sheet(`${inner}<div style="display:flex;gap:10px;margin-top:18px"><button class="ghost" id="mkLearn" style="flex:1">Mark as learning</button><button class="primary" data-close style="flex:1">Close</button></div>`, root=>{
    root.querySelector(".panel").classList.add("detail");
    bindBack(root,w);
    root.querySelector("#mkLearn").onclick=()=>{S.lv[w.w]=1;save();closeSheet();};
  }, renderList);
}

buildQueue();
try{ if("serviceWorker" in navigator && location.protocol==="https:" && !/claude\.ai|claudeusercontent/.test(location.hostname) && window.self===window.top) navigator.serviceWorker.register("sw.js"); }catch(e){}
})();
</script>
